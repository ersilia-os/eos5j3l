Identifier: eos5j3l
Slug: enscondflow-shape
Status: In progress
Title: Ensemble-Conditioned Molecular Design
Description: Generates 10 molecules conditioned on the 3D shape and 
  pharmacophore profile of an input compound, using flow matching with 
  ensemble-conditioned guidance from AstraZeneca and Chalmers. Trained on 300K 
  GEOM-Drugs molecules with CREST conformer ensembles and 35K PDB-derived 
  protein-ligand complexes. Drug-like inputs yield structurally distinct 
  compounds; small rigid molecules are instead often reproduced, so guidance is 
  weakened from the published defaults and the input compound and duplicates are
  filtered from the returned set.
